<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1D9E75" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinTrack" />
  <title>FinTrack India</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" />
</head>
<body>

<!-- APP BAR -->
<div class="app-bar">
  <h1>💰 FinTrack</h1>
  <button class="month-pill" id="monthPill"><i class="ti ti-calendar"></i> Jun</button>
</div>

<!-- MONTH PICKER SHEET -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Select Month</h2>
    <div class="month-grid" id="monthGrid"></div>
  </div>
</div>

<!-- ENTRY SHEET -->
<div class="sheet-backdrop" id="entrySheetBackdrop">
  <div class="sheet entry-sheet">
    <div class="sheet-handle"></div>
    <div class="entry-sheet-header">
      <span class="entry-sheet-title" id="entrySheetTitle">Add Entry</span>
      <button class="sheet-close-btn" onclick="closeEntrySheet()"><i class="ti ti-x"></i></button>
    </div>

    <div class="entry-form">
      <div class="entry-form-row">
        <div class="entry-field">
          <label>Amount</label>
          <div class="entry-input-wrap">
            <span class="entry-sym">₹</span>
            <input type="number" inputmode="decimal" id="entryAmountInput" placeholder="0" />
          </div>
        </div>
        <div class="entry-field">
          <label>Date</label>
          <div class="entry-input-wrap">
            <input type="date" id="entryDateInput" />
          </div>
        </div>
      </div>
      <div class="entry-field" style="margin-top:10px">
        <label>Note <span style="opacity:.5">(optional)</span></label>
        <div class="entry-input-wrap">
          <input type="text" id="entryNoteInput" placeholder="e.g. cow milk 3 litres" maxlength="60" />
        </div>
      </div>
      <button class="add-btn" onclick="addEntry()"><i class="ti ti-plus"></i> Add Entry</button>
    </div>

    <div class="entry-log-header">
      <span>This month's entries</span>
      <span id="entryLogTotal" style="font-weight:600;color:var(--green)"></span>
    </div>
    <div class="entry-log" id="entryLog"></div>
  </div>
</div>

<!-- HOME VIEW -->
<div class="view active" id="homeView">
  <div class="scroll-area">

    <div class="salary-card">
      <label>Monthly Take-Home Salary</label>
      <div class="salary-input-row">
        <span class="sym">₹</span>
        <input type="number" inputmode="numeric" id="salaryInput" placeholder="0" />
      </div>
    </div>

    <div class="summary-row">
      <div class="sum-card green-card">
        <div class="slabel">Net Savings</div>
        <div class="sval" id="s-savings" style="color:var(--green-text)">₹0</div>
        <div class="ssub" id="s-sav-pct">0% rate</div>
      </div>
      <div class="sum-card red-card">
        <div class="slabel">Total Spent</div>
        <div class="sval" id="s-spent" style="color:var(--red-text)">₹0</div>
        <div class="ssub" id="s-pct">0% of income</div>
      </div>
      <div class="sum-card" id="remCard" style="grid-column:span 2">
        <div class="slabel">Remaining Balance</div>
        <div class="sval" id="s-remaining">₹0</div>
        <div class="ssub" id="s-rem-note">Left this month</div>
      </div>
    </div>

    <div class="alert" id="alertBanner"></div>

    <div class="prog-block">
      <div class="prog-header"><span>Expense ratio</span><span id="expPctLabel">0%</span></div>
      <div class="prog-track"><div class="prog-fill" id="expFill" style="width:0%"></div></div>
      <div class="breakdown-bar" id="bbar"></div>
      <div class="legend-wrap" id="bleg"></div>
    </div>

    <div class="goal-card">
      <label>Monthly Savings Goal</label>
      <div class="goal-input-row">
        <span class="rsym">₹</span>
        <input type="number" inputmode="numeric" id="goalInput" placeholder="e.g. 15000" />
      </div>
      <div id="goalProg" style="display:none">
        <div class="goal-prog-label">
          <span>Progress</span>
          <span id="goalLabel"></span>
          <span id="goalPct"></span>
        </div>
        <div class="prog-track"><div class="prog-fill" id="goalFill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="tips-card">
      <div class="tips-title">💡 Smart Insights</div>
      <div id="tipsList"></div>
    </div>

  </div>
</div>

<!-- EXPENSES VIEW -->
<div class="view" id="expensesView">
  <div class="scroll-area" id="expenseContainer"></div>
</div>

<!-- ANALYTICS VIEW -->
<div class="view" id="analyticsView">
  <div class="scroll-area">
    <div class="prog-block" style="margin-bottom:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div class="an-label">Income</div><div class="an-big" id="aSalary">₹0</div></div>
        <div><div class="an-label">Expenses</div><div class="an-big" id="aExpenses" style="color:var(--red-text)">₹0</div></div>
        <div><div class="an-label">Investments</div><div class="an-big" id="aSavings" style="color:var(--green-text)">₹0</div></div>
        <div><div class="an-label">Savings Rate</div><div class="an-big" id="aSavRate" style="color:var(--green-text)">0%</div></div>
      </div>
    </div>
    <div class="prog-block">
      <div class="tips-title" style="margin-bottom:14px">Spend by Category</div>
      <div id="analyticsList"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="switchView('home')">
    <i class="ti ti-home"></i>Home
  </button>
  <button class="nav-btn" id="nav-expenses" onclick="switchView('expenses')">
    <i class="ti ti-receipt"></i>Expenses
  </button>
  <button class="nav-btn" id="nav-analytics" onclick="switchView('analytics')">
    <i class="ti ti-chart-bar"></i>Analytics
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
